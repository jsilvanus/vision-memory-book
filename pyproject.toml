[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "vision-memory-book"
version = "0.1.0"
description = "Local-first, privacy-preserving photo indexer, MCP server, and memory book generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "sqlite-vec>=0.1.6",
    "mcp>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vision_memory_book"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
