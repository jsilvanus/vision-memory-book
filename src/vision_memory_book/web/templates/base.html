<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vision Memory Book{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --border: #e2e2dd;
      --text: #1c1c1a;
      --muted: #666660;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --warn: #d97706;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      text-decoration: none;
      color: var(--text);
    }
    nav {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 500;
    }
    nav a:hover { color: var(--accent); }
    main {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1.25rem 3rem;
    }
    h1, h2, h3 { margin-top: 0; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.75rem;
    }
    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }
    .stat-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-size: 1.5rem; font-weight: 700; }
    .btn {
      display: inline-block;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--text); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.82rem; }
    input, select, textarea {
      font: inherit;
      padding: 0.45rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge-ok { color: var(--success); border-color: #bbf7d0; background: #f0fdf4; }
    .badge-warn { color: var(--warn); border-color: #fde68a; background: #fffbeb; }
    .photo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .photo-thumb {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #eaeae5;
      display: block;
    }
    .photo-body {
      padding: 0.75rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .muted { color: var(--muted); font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 0.5rem 0.65rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { color: var(--muted); font-weight: 600; }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Vision Memory Book</a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/gallery">Gallery</a>
      <a href="/groups">Groups</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
